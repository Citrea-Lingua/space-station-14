- type: entity
  parent: [BaseMobSpeciesOrganic, BaseSpeciesPickupableHuge]
  id: BaseMobXeno
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Xeno
    understands:
    - GalacticCommon
    - Xeno
  - type: Speech
    speechVerb: Xeno
    speechSounds: UnisexXeno
  - type: TypingIndicator
    proto: alien
  - type: Absorbable
  - type: Hunger
    baseDecayRate: 5.1 #very hungry, for a player species
    starvingSlowdownModifier: 1.0
    applyStarvationVignette: true
  - type: Icon
    sprite: _Starlight/Mobs/Species/Xeno/parts.rsi
    state: xeno
  - type: Thirst
  - type: Butcherable
    spawned:
    - id: FoodMeatXeno
      amount: 5
  - type: HumanoidAppearance
    species: Xeno
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Body
    prototype: Xeno
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Xeno
  - type: Vocal
  - type: Inventory
    speciesId: Xeno
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: XenoBlood
        Quantity: 600
  - type: Puller
    needsHands: false
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 5
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic: [ Touch, Ingestion ]
    reactions:
    - reagents: [ Water, SpaceCleaner]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ WeldingFuel, Phlogiston, Napalm, Benzene, Oil, Vodka, Absinthe ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Hisses
        showInChat: false
  - type: BodyEmotes
    soundsId: UnisexXeno

- type: entity
  parent: BaseSpeciesDummy
  id: MobXenoDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Xeno
  - type: Body
    prototype: Xeno
  - type: Inventory
    speciesId: Xeno
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
